resources:
  jobs:
    Pipeline_CineData_Analytics:
      name: Pipeline_CineData_Analytics
      schedule:
        quartz_cron_expression: 5 5 12 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: Task_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/isabellabronn6@gmail.com/Projeto_CineData/Bronze
            source: WORKSPACE
          environment_key: Task_Bronze_environment
        - task_key: Task_Silver
          depends_on:
            - task_key: Task_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/isabellabronn6@gmail.com/Projeto_CineData/Silver
            source: WORKSPACE
        - task_key: Task_Gold
          depends_on:
            - task_key: Task_Silver
          notebook_task:
            notebook_path: /Workspace/Users/isabellabronn6@gmail.com/Projeto_CineData/Gold
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Task_Bronze_environment
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
